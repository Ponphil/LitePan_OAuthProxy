<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LitePan OAuth认证代理</title>
    <style>
        :root {
            --accent: #416f9c;
            --accent-dark: #315a82;
            --soft: #e7f0f8;
            --ink: #27313a;
            --muted: #747c83;
            --line: #dfe8ef;
            --card: rgba(255, 255, 255, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background: linear-gradient(180deg, #f7f9fc 0%, #eaf1f7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .main-container {
            width: min(480px, 100%);
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 28px;
            padding: 42px;
            box-shadow: 0 24px 70px rgba(35, 45, 55, 0.08);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 34px;
        }

        .header h1 {
            font-size: 28px;
            line-height: 1.25;
            letter-spacing: -0.04em;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        .select-container {
            position: relative;
            margin-bottom: 18px;
        }

        .select-label {
            display: block;
            color: #42505b;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .custom-select {
            position: relative;
            width: 100%;
        }

        .select-button {
            width: 100%;
            height: 58px;
            padding: 0 18px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            color: var(--ink);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .select-button:hover {
            border-color: #c5d6e4;
            box-shadow: 0 12px 28px rgba(65, 111, 156, 0.08);
        }

        .select-arrow {
            color: var(--accent);
            transition: transform 0.2s ease;
            font-size: 13px;
        }

        .select-arrow.open {
            transform: rotate(180deg);
        }

        .select-options {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: all 0.2s ease;
            z-index: 100;
            box-shadow: 0 18px 42px rgba(35, 45, 55, 0.10);
        }

        .select-options.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .select-option {
            padding: 15px 18px;
            color: var(--ink);
            cursor: pointer;
            transition: background-color 0.2s ease;
            border-bottom: 1px solid #eef3f6;
        }

        .select-option:last-child {
            border-bottom: none;
        }

        .select-option:hover {
            background: var(--soft);
            color: var(--accent-dark);
        }

        .server-info {
            text-align: center;
        }

        .info-text {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(35, 49, 58, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            z-index: 1000;
            padding: 24px;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            width: min(380px, 100%);
            background: #fff;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            transform: translateY(10px) scale(0.98);
            transition: transform 0.2s ease;
            box-shadow: 0 28px 80px rgba(35, 45, 55, 0.16);
        }

        .modal-overlay.show .modal {
            transform: translateY(0) scale(1);
        }

        .modal h3 {
            color: var(--ink);
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .modal p {
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 24px;
            line-height: 1.7;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            height: 46px;
            padding: 0 22px;
            border: none;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 108px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-dark);
        }

        .btn-secondary {
            background: #f4f7f9;
            color: #61707c;
        }

        .btn-secondary:hover {
            background: #e9eef2;
        }

        @media (max-width: 480px) {
            .main-container {
                padding: 30px 24px;
                border-radius: 24px;
            }

            .header h1 {
                font-size: 24px;
            }

            .modal-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>OAuth Token 代理</h1>
            <p>选择您的网盘类型开始获取Token</p>
        </div>
        
        <form id="oauthForm" method="post" action="/start">
            <div class="select-container">
                <label class="select-label">网盘类型</label>
                <div class="custom-select">
                    <div class="select-button" onclick="toggleSelect()">
                        <span id="selectedText">请选择网盘类型</span>
                        <span class="select-arrow">▼</span>
                    </div>
                    <div class="select-options" id="selectOptions">
                        {% for driver in drivers %}
                        <div class="select-option" onclick="selectDriver('{{ driver.value }}', '{{ driver.name }}')">
                            {{ driver.name }}
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            
            <div class="server-info">
                <span class="info-text">🔒 本程序将使用内置开发者凭据</span>
            </div>
            
            <input type="hidden" name="driver_type" id="driver_type">
            <input type="hidden" name="server_use" value="true">
            <input type="hidden" name="client_id" id="client_id">
            <input type="hidden" name="client_secret" id="client_secret">
        </form>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>获取 OAuth Token</h3>
            <p>确认要获取 <span id="modalDriverName"></span> 的访问令牌吗？</p>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="confirmOAuth()">确认获取</button>
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        let selectedDriverType = null;
        let selectedDriverName = null;

        function toggleSelect() {
            const options = document.getElementById('selectOptions');
            const arrow = document.querySelector('.select-arrow');
            
            options.classList.toggle('open');
            arrow.classList.toggle('open');
        }

        function selectDriver(driverType, driverName) {
            selectedDriverType = driverType;
            selectedDriverName = driverName;
            
            document.getElementById('selectedText').textContent = driverName;
            document.getElementById('driver_type').value = driverType;
            
            const options = document.getElementById('selectOptions');
            const arrow = document.querySelector('.select-arrow');
            options.classList.remove('open');
            arrow.classList.remove('open');
            
            showModal(driverName);
        }

        function showModal(driverName) {
            document.getElementById('modalDriverName').textContent = driverName;
            document.getElementById('modalOverlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function confirmOAuth() {
            if (selectedDriverType) {
                document.getElementById('oauthForm').submit();
            }
        }

        document.addEventListener('click', function(event) {
            const select = document.querySelector('.custom-select');
            if (!select.contains(event.target)) {
                const options = document.getElementById('selectOptions');
                const arrow = document.querySelector('.select-arrow');
                options.classList.remove('open');
                arrow.classList.remove('open');
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        document.getElementById('modalOverlay').addEventListener('click', function(event) {
            if (event.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
