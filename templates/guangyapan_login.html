<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光鸭云盘认证 - LitePan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(255, 193, 137, 0.55), transparent 35%),
                radial-gradient(circle at bottom right, rgba(255, 221, 193, 0.45), transparent 32%),
                linear-gradient(135deg, #fff8f1 0%, #fff1e3 52%, #ffe7d2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 24px;
            padding: 2.1rem 2rem 1.8rem;
            box-shadow: 0 24px 60px rgba(244, 120, 32, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 1.6rem;
        }

        .header h1 {
            color: #232323;
            font-size: 1.8rem;
            margin-bottom: 0.55rem;
            font-weight: 700;
        }

        .status-box {
            border-radius: 14px;
            padding: 0.9rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.93rem;
            line-height: 1.6;
        }

        .status-box.info {
            background: #fff6ed;
            color: #a75816;
            border: 1px solid #ffd2a8;
        }

        .status-box.success {
            background: #eefcf2;
            color: #1f7a36;
            border: 1px solid #bde7c8;
        }

        .status-box.error {
            background: #fff1f1;
            color: #c33b3b;
            border: 1px solid #f2b8b8;
        }

        .field {
            margin-bottom: 1rem;
        }

        .field input {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 16px;
            background: #f5f5f5;
            padding: 0 1.1rem;
            font-size: 1rem;
            color: #333;
            outline: none;
            transition: box-shadow 0.2s ease, background 0.2s ease;
        }

        .field input:focus {
            background: #fff;
            box-shadow: 0 0 0 2px rgba(255, 130, 32, 0.18);
        }

        .field input::placeholder {
            color: #a7a7a7;
        }

        .code-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 124px;
            gap: 0.75rem;
            margin-bottom: 1.15rem;
        }

        .send-btn,
        .submit-btn {
            border: none;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
        }

        .send-btn:hover,
        .submit-btn:hover {
            transform: translateY(-1px);
        }

        .send-btn {
            height: 56px;
            border-radius: 16px;
            background: #fff3e8;
            color: #ff7a1a;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .send-btn:active,
        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn {
            width: 100%;
            height: 58px;
            border-radius: 18px;
            background: linear-gradient(135deg, #ff8c2a, #ff6a00);
            color: #fff;
            font-size: 1.08rem;
            font-weight: 700;
            box-shadow: 0 16px 30px rgba(255, 122, 26, 0.22);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 520px) {
            .login-card {
                padding: 1.5rem 1.15rem 1.3rem;
                border-radius: 20px;
            }

            .code-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header">
            <h1>光鸭云盘认证</h1>
        </div>

        {% if message %}
        <div class="status-box {{ message_type or 'info' }}">
            {{ message }}
        </div>
        {% endif %}

        <form method="post" action="/guangyapan/login">
            <input type="hidden" name="session_id" value="{{ session_id }}">
            <input type="hidden" name="action" value="login">
            <input type="hidden" name="captcha_token" value="{{ form_data.captcha_token or '' }}">
            <input type="hidden" name="verification_id" value="{{ form_data.verification_id or '' }}">
            <input type="hidden" name="device_id" value="{{ form_data.device_id or '' }}">

            <div class="field">
                <input id="phone_number" name="phone_number" type="text" value="{{ form_data.phone_number or '' }}" placeholder="手机号码，例如 +86 13800000000" required>
            </div>

            <div class="code-row">
                <div class="field" style="margin-bottom: 0;">
                    <input id="verify_code" name="verify_code" type="text" value="" placeholder="短信验证码">
                </div>

                <button class="send-btn" type="button" onclick="prepareSendCode()">
                    发送验证码
                </button>
            </div>

            <button class="submit-btn" type="submit">登录并获取 Token</button>
        </form>
    </div>

    <form id="sendCodeForm" class="hidden" method="post" action="/guangyapan/login">
        <input type="hidden" name="session_id" value="{{ session_id }}">
        <input type="hidden" name="action" value="send_code">
        <input type="hidden" name="phone_number" id="send_code_phone_number" value="{{ form_data.phone_number or '' }}">
        <input type="hidden" name="device_id" value="{{ form_data.device_id or '' }}">
    </form>

    <script>
        function prepareSendCode() {
            const phoneValue = document.getElementById('phone_number').value || '';
            document.getElementById('send_code_phone_number').value = phoneValue;
            document.getElementById('sendCodeForm').submit();
        }
    </script>
</body>
</html>
